# Prefill role of the Tokens native P/D deployment (GLM-5.2 NVFP4, TP x PP,
# MooncakeConnector as kv_producer). Feed to `vllm serve --config prefill.yaml`.
# Required process env (not expressible in this file):
#   VLLM_PLUGINS=""                            # disable entry-point plugins
#   VLLM_PP_LAYER_PARTITION=22,20,20,16        # must have pipeline-parallel-size entries
#   XCCL_TURBO_PREFILL_MLA_HEAD_PADDING=64
#   VLLM_MOONCAKE_BOOTSTRAP_PORT=8998          # Mooncake bootstrap server port
# CLI flags still win over values here (cli > config > defaults).
model: /home/service/works/models_ssd/GLM-5.2-NVFP4-W4A4C8-MG40-BNT3/v1
served-model-name: GLM-5.2-NVFP4-W4A4C8-MG40-BNT3
host: 0.0.0.0
port: 8010
tensor-parallel-size: 1
pipeline-parallel-size: 4
distributed-executor-backend: mp
# GLM-5.2 NVFP4 requires a uniform page size of 64 across PP ranks.
block-size: 64
max-model-len: 1048576
max-num-seqs: 8
max-num-batched-tokens: 32768
gpu-memory-utilization: 0.90
enable-prefix-caching: true
kv-cache-dtype: fp8
speculative-config:
  method: mtp
  num_speculative_tokens: 3
compilation-config:
  cudagraph_mode: NONE
kernel-config:
  enable_flashinfer_autotune: false
kv-transfer-config:
  kv_connector: MooncakeConnector
  kv_role: kv_producer

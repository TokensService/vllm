# model_arch.yaml — Tokens deployment strategy registry for vLLM serving.
#
# Each top-level key is an arch_name identifying one deployment strategy:
#   <model>-<quant>-<platform>-<topology>
# e.g. GLM-5.2-W4A4C8-EMS-3P1D = GLM-5.2 model, W4A4C8 quantization, EMS
# platform, 3 Prefill + 1 Decode instances. The topology suffix is <n>P<m>D
# for disaggregated strategies, <n>P for standalone-only ones.
#
# Each strategy holds per-role sections (prefill / decode / standalone):
#   engine: engine arguments compatible with `vllm serve --config`
#   env:    process environment variables (not expressible in --config)
# Extract one role with render_serve_config.py, e.g.:
#   vllm serve --config <(render_serve_config.py <arch_name> prefill)
#   eval "$(render_serve_config.py <arch_name> prefill --env)"

GLM-5.2-W4A4C8-MG40-BNT3-1P1D:
  description: >-
    GLM-5.2 NVFP4 (W4A4C8) on the MG40-BNT3 platform: 1 Prefill pod
    (TP1 x PP4) + 1 Decode pod (TP1 x DP4 over Ray), KV transfer over
    MooncakeConnector, Mooncake proxy exposing :8000.
  prefill:
    env:
      VLLM_PLUGINS: ""
      # One entry per pipeline-parallel-size rank.
      VLLM_PP_LAYER_PARTITION: "22,20,20,16"
      XCCL_TURBO_PREFILL_MLA_HEAD_PADDING: "64"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "8998"
    engine:
      model: /home/service/works/models_ssd/GLM-5.2-NVFP4-W4A4C8-MG40-BNT3/v1
      served-model-name: GLM-5.2-NVFP4-W4A4C8-MG40-BNT3
      host: 0.0.0.0
      port: 8010
      tensor-parallel-size: 1
      pipeline-parallel-size: 4
      distributed-executor-backend: mp
      # GLM-5.2 NVFP4 requires a uniform page size of 64 across PP ranks.
      block-size: 64
      max-model-len: 1048576
      max-num-seqs: 8
      max-num-batched-tokens: 32768
      gpu-memory-utilization: 0.90
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      speculative-config:
        method: mtp
        num_speculative_tokens: 3
      compilation-config:
        cudagraph_mode: NONE
      kernel-config:
        enable_flashinfer_autotune: false
      kv-transfer-config:
        kv_connector: MooncakeConnector
        kv_role: kv_producer
  decode:
    env:
      VLLM_PLUGINS: ""
      RAY_EXPERIMENTAL_NOSET_CUDA_VISIBLE_DEVICES: "1"
    engine:
      model: /home/service/works/models_ssd/GLM-5.2-NVFP4-W4A4C8-MG40-BNT3/v1
      served-model-name: GLM-5.2-NVFP4-W4A4C8-MG40-BNT3
      host: 0.0.0.0
      port: 8020
      tensor-parallel-size: 1
      data-parallel-size: 4
      data-parallel-backend: ray
      distributed-executor-backend: mp
      block-size: 64
      max-model-len: 1048576
      max-num-seqs: 32
      max-num-batched-tokens: 128
      gpu-memory-utilization: 0.94
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      async-scheduling: true
      speculative-config:
        method: mtp
        num_speculative_tokens: 3
      compilation-config:
        cudagraph_mode: NONE
      kernel-config:
        enable_flashinfer_autotune: false
      kv-transfer-config:
        kv_connector: MooncakeConnector
        kv_role: kv_consumer
  # DEPLOY_MODE=standalone baseline: Prefill-shaped single instance serving
  # directly, without Mooncake / P/D disaggregation.
  standalone:
    env:
      VLLM_PLUGINS: ""
      VLLM_PP_LAYER_PARTITION: "22,20,20,16"
      XCCL_TURBO_PREFILL_MLA_HEAD_PADDING: "64"
    engine:
      model: /home/service/works/models_ssd/GLM-5.2-NVFP4-W4A4C8-MG40-BNT3/v1
      served-model-name: GLM-5.2-NVFP4-W4A4C8-MG40-BNT3
      host: 0.0.0.0
      port: 8000
      tensor-parallel-size: 1
      pipeline-parallel-size: 4
      distributed-executor-backend: mp
      block-size: 64
      max-model-len: 1048576
      max-num-seqs: 8
      max-num-batched-tokens: 32768
      gpu-memory-utilization: 0.90
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      speculative-config:
        method: mtp
        num_speculative_tokens: 3
      compilation-config:
        cudagraph_mode: NONE
      kernel-config:
        enable_flashinfer_autotune: false

GLM-5.3-W4A4C8-MG42-BNT3-1P1D:
  description: >-
    GLM-5.3 NVFP4/W4A4C8（compressed-tensors：NVFP4 4bit + 部分层 FP8 8bit）在单机
    8×H800 上：1 个 Prefill 实例（TP1 x PP4，:8010）+ 1 个 Decode 实例（TP1 x DP4，:8020），
    KV 经 MooncakeConnector 走 RDMA(RoCE) 传输；由 vllm-router 对外提供 :8000。
  prefill:
    env:
      # 78 层按 PP4 切分（不指定时 vLLM 默认切 19/20/20/19）
      VLLM_PP_LAYER_PARTITION: "22,20,20,16"
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "8998"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    engine:
      model: /mnt/paas/GLM-5.3-NVFP4-W4A4-MG42-BNT3/v1
      served-model-name: GLM-5.3-W4A4C8-MG42-BNT3-1P1D
      host: 0.0.0.0
      port: 8010
      tensor-parallel-size: 1
      pipeline-parallel-size: 4
      distributed-executor-backend: mp
      # GLM-5.3 的 DSA 稀疏注意力要求 PP 各 rank 页大小统一为 64
      block-size: 64
      max-model-len: 1048576
      gpu-memory-utilization: 0.9
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # 先保证最快拉起：关掉 flashinfer autotune（性能调优阶段再打开）
      kernel-config:
        enable_flashinfer_autotune: false
      kv-transfer-config:
        kv_connector: MooncakeConnector
        kv_role: kv_producer
      tool-call-parser: glm47
      reasoning-parser: glm47
      enable-auto-tool-choice: true
  decode:
    env:
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    engine:
      model: /mnt/paas/GLM-5.3-NVFP4-W4A4-MG42-BNT3/v1
      served-model-name: GLM-5.3-W4A4C8-MG42-BNT3-1P1D
      host: 0.0.0.0
      port: 8020
      tensor-parallel-size: 1
      data-parallel-size: 4
      # 单机形态：本地 DP（无 Ray）；多机时改小 data-parallel-size-local
      data-parallel-backend: mp
      data-parallel-size-local: 4
      distributed-executor-backend: mp
      block-size: 64
      max-model-len: 1048576
      max-num-seqs: 32
      max-num-batched-tokens: 128
      gpu-memory-utilization: 0.94
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # MTP：decode 侧用 3 个 draft token
      speculative-config:
        method: mtp
        num_speculative_tokens: 3
      compilation-config:
        cudagraph_mode: FULL_DECODE_ONLY
      kernel-config:
        enable_flashinfer_autotune: false
      kv-transfer-config:
        kv_connector: MooncakeConnector
        kv_role: kv_consumer
      tool-call-parser: glm47
      reasoning-parser: glm47
      enable-auto-tool-choice: true
  # 非 P/D 基线：单个 Prefill 形态实例直服（对照/排障用）
  standalone:
    env:
      VLLM_PP_LAYER_PARTITION: "22,20,20,16"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
    engine:
      model: /mnt/paas/GLM-5.3-NVFP4-W4A4-MG42-BNT3/v1
      served-model-name: GLM-5.3-W4A4C8-MG42-BNT3-1P1D
      host: 0.0.0.0
      port: 8000
      tensor-parallel-size: 1
      pipeline-parallel-size: 4
      distributed-executor-backend: mp
      block-size: 64
      max-model-len: 1048576
      gpu-memory-utilization: 0.9
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # MTP：standalone 按 decode 口径开 3
      speculative-config:
        method: mtp
        num_speculative_tokens: 3
      kernel-config:
        enable_flashinfer_autotune: false
      tool-call-parser: glm47
      reasoning-parser: glm47
      enable-auto-tool-choice: true

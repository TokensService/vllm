GLM-5.3-NVFP4-NVIDIA-BNT3-1P1D-8G:
  description: >-
    GLM-5.3 NVIDIA 原生 NVFP4 在单机 8×H800 上：1 个 Prefill 实例（TP1 x DP4，
    :8010）+ 1 个 Decode 实例（TP1 x DP4，:8020），合计 8 卡，KV 经
    MooncakeConnector 走 RDMA(RoCE) 传输；由 vllm-router 对外提供 :8000。本策略
    不写死权重路径（engine 不含 model），部署时由编排层 / 命令行以 --model 指定。
  prefill:
    env:
      # P 侧用 DP4（无 PP），故不设 VLLM_PP_LAYER_PARTITION
      VLLM_MOONCAKE_BOOTSTRAP_PORT: "8998"
      VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      # router 复用连接的空闲间隔可能远超镜像默认的 5s（router 写请求体时会撞 Broken pipe）
      VLLM_HTTP_TIMEOUT_KEEP_ALIVE: "75"
    engine:
      served-model-name: GLM-5.3-NVFP4-NVIDIA-BNT3-1P1D-8G
      host: 0.0.0.0
      port: 8010
      tensor-parallel-size: 1
      data-parallel-size: 4
      data-parallel-backend: mp
      data-parallel-size-local: 4
      distributed-executor-backend: mp
      # GLM-5.3 的 DSA 稀疏注意力要求页大小固定 64；DP4 各副本取值一致，且需与
      # decode 侧保持一致（MooncakeConnector 传输 KV 要求 P/D 页布局相同）
      block-size: 64
      max-model-len: 524288
      gpu-memory-utilization: 0.94
      enable-prefix-caching: true
      kv-cache-dtype: fp8
      # P 侧开 enforce-eager：跳过 CUDA graph 捕获/编译
      enforce-eager: true
      # P 侧先保持不开 MTP（关闭方式 = 不写 speculative-config）：
      #   - num_speculative_tokens: 0 会被 SpeculativeConfig pydantic 校验拒绝，
      #     故用"省略该键"表达关闭；
